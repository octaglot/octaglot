name: Release

# Only tags cut a release -- ordinary pushes to main build nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Fails fast when the tag does not match the version in the manifests,
  # which would otherwise ship assets labelled with the wrong version.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Compare tag against manifests
        run: |
          version="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$version package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Version mismatch: tag is $version but a manifest says $v"
              exit 1
            fi
          done

  # Draft first, publish last: a failed Windows build must not leave a
  # half-populated release visible on the downloads page.
  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Octaglot ${TAG#v}" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            asset: Octaglot-macos-arm64.dmg
            pattern: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            asset: Octaglot-macos-intel.dmg
            pattern: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset: Octaglot-windows-x64-setup.exe
            pattern: 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - run: npm ci

      - name: Build bundle
        run: npm run tauri -- build --target ${{ matrix.rust_target }}

      - name: Upload asset under a stable name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(ls ${{ matrix.pattern }} | head -1)
          if [ -z "$built" ]; then
            echo "::error::No bundle matched ${{ matrix.pattern }}"
            exit 1
          fi
          # Stable filenames let the website link to /releases/latest/download/
          # forever instead of being edited on every release.
          mv "$built" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
