<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#9b60be" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Translate's TTS endpoint 404s any request carrying a Referer, and
         media loads send the page's Referer too. This policy strips the Referer
         from every subresource request leaving the document. The app makes no
         other external requests, so there is no side effect. -->
    <meta name="referrer" content="no-referrer" />
    <title>Octaglot</title>
    <script>
      /* Apply the theme before React mounts, otherwise a frame of white flashes
         on startup. The key matches src/lib/theme.ts; the default is dark. */
      (function () {
        try {
          var pref = localStorage.getItem('octaglot-theme') || 'dark';
          var dark =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : pref === 'dark';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
